      moving = false; vel = {x:0,y:0}; splash = 0.6; st.strokes[st.hole]++; ball = {...lastPos}; hud(); save(); showToast('Splash', 'One penalty stroke. Back to your last spot.', 'OK', ()=>{}); return;
    }
    if (sp < 7 && cd2 > CUP + 5){ moving = false; vel = {x:0,y:0}; save(); if (st.strokes[st.hole] >= MAXS) holeDone(true); }
  }
  function showToast(title, body, btn, cb){
    toast.innerHTML = `<b>${esc(title)}</b><span>${esc(body)}</span><button class="btn primary" id="tbtn">${esc(btn)}</button>`;
    toast.hidden = false;
    const b = toast.querySelector('#tbtn'); b.focus({preventScroll:true});
    b.onclick = () => { toast.hidden = true; cb(); };
  }
  function holeDone(pickedUp){
    const n = st.strokes[st.hole], d = n - hole.par;
    const name = pickedUp ? 'Picked up' : n === 1 ? 'Hole in one!' : (NAMES[String(d)] || `${toPar(d)} on the hole`);
    const lastHole = st.hole === 2;
    showToast(name, `${n} stroke${n===1?'':'s'} on a par ${hole.par}.`, lastHole ? 'See scorecard' : 'Next hole', () => {
      if (lastHole){ st.hole = 3; st.ball = null; store.set(key, st); hud(); finishRound(); return; }
      st.hole++; hole = holes[st.hole]; ball = {...hole.tee}; lastPos = {...ball}; sunk = false; save(); hud();
    });
  }
  function finishRound(){
    const tot = st.strokes.reduce((a,b)=>a+b,0), d = tot - parTotal;
    const sq = st.strokes.map((n,i) => { const x = n - holes[i].par; return n===1 ? '⭐' : x < 0 ? '🟩' : x === 0 ? '⬜' : x === 1 ? '🟨' : '🟥'; }).join('');
    api.finish({score: tot, won: d <= 2, title: d < 0 ? 'Under par' : d === 0 ? 'Even par' : d <= 2 ? 'Nicely played' : 'Tough greens',
      detail: `${tot} strokes on a par ${parTotal} (${toPar(d)}). Holes: ${st.strokes.join(', ')}.`,
      summary: `${tot} (${toPar(d)})`,
      share: `Daybook Putt No. ${DAY_NO}  ${tot} (${toPar(d)})\n${sq}  ${st.strokes.join(' · ')}`});
  }

  /* drawing */
  function rr(x,y,w,h,rad){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,rad) : ctx.rect(x,y,w,h); }
  function draw(){
    ctx.clearRect(0,0,PW,PH);
    ctx.fillStyle = '#6E5236'; ctx.fillRect(0,0,PW,PH);
    ctx.fillStyle = '#87663F'; rr(6,6,PW-12,PH-12,10); ctx.fill();
    for (let y = PB.y, i = 0; y < PB.y+PB.h; y += 44, i++){ ctx.fillStyle = i%2 ? '#4E9F45' : '#57A94D'; ctx.fillRect(PB.x, y, PB.w, Math.min(44, PB.y+PB.h-y)); }
    for (const s of hole.sand){ ctx.fillStyle = '#E3CF9C'; rr(s.x,s.y,s.w,s.h,18); ctx.fill(); ctx.fillStyle = 'rgba(150,120,60,.35)'; for (let i=0;i<14;i++){ const px = s.x + 10 + ((i*37)%(s.w-20)), py = s.y + 8 + ((i*23)%(s.h-16)); ctx.fillRect(px,py,2,2); } }
    for (const w of hole.water){ ctx.fillStyle = '#2F7FC1'; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; const t = performance.now()/600; for (let yy = w.y+12; yy < w.y+w.h-6; yy += 16){ ctx.beginPath(); for (let xx = w.x; xx <= w.x+w.w; xx += 6){ const yv = yy + Math.sin(xx/14 + t)*2.5; xx===w.x ? ctx.moveTo(xx,yv) : ctx.lineTo(xx,yv); } ctx.stroke(); } }
    ctx.fillStyle = 'rgba(0,0,0,.08)'; rr(hole.tee.x-16, hole.tee.y-10, 32, 20, 5); ctx.fill();
    for (const w of hole.walls){ ctx.fillStyle = '#7A5A36'; rr(w.x, w.y, w.w, w.h, 3); ctx.fill(); ctx.fillStyle = '#9C7849'; ctx.fillRect(w.x+2, w.y+2, Math.max(0,w.w-4), Math.min(4, w.h-4)); }
    for (const b of hole.bumpers){ ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.arc(b.x+2,b.y+3,b.r,0,7); ctx.fill(); ctx.fillStyle = '#E9E3D3'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); ctx.strokeStyle = '#C8402F'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x,b.y,b.r-5,0,7); ctx.stroke(); }
    // cup + flag
    ctx.fillStyle = '#1B2A18'; ctx.beginPath(); ctx.arc(hole.cup.x, hole.cup.y, CUP, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    if (!sunk){ ctx.strokeStyle = '#F2F2EE'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hole.cup.x, hole.cup.y); ctx.lineTo(hole.cup.x, hole.cup.y-44); ctx.stroke(); ctx.fillStyle = '#E2483C'; ctx.beginPath(); ctx.moveTo(hole.cup.x, hole.cup.y-44); ctx.lineTo(hole.cup.x+22, hole.cup.y-37); ctx.lineTo(hole.cup.x, hole.cup.y-30); ctx.fill(); }
    // aim
    if (aim){
      const dx = aim.sx - aim.x, dy = aim.sy - aim.y, len = Math.hypot(dx,dy);
      if (len > 4){
        const p = Math.min(len,150)/150, ux = dx/len, uy = dy/len, L = 26 + p*120;
        ctx.setLineDash([5,6]); ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x+ux*L, ball.y+uy*L); ctx.stroke(); ctx.setLineDash([]);
        ctx.strokeStyle = `hsl(${120-120*p} 85% 50%)`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL+7, -Math.PI/2, -Math.PI/2 + p*Math.PI*2); ctx.stroke();
      }
    }
    // ball
    let br = BALL, bx = ball.x, by = ball.y;
    if (sunk){ br = BALL * Math.max(0, 1 - sink/0.35); bx = ball.x + (hole.cup.x-ball.x)*Math.min(1,sink/0.2); by = ball.y + (hole.cup.y-ball.y)*Math.min(1,sink/0.2); }
    if (br > 0.3){ ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(bx+1.5, by+2, br, 0, 7); ctx.fill(); ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill(); }
    if (splash > 0){ ctx.strokeStyle = `rgba(255,255,255,${splash})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ball.x, ball.y, 10 + (0.6-splash)*40, 0, 7); ctx.stroke(); }
  }
  function loop(t){
    const dt = Math.min(0.05, (t - (lastT || t))/1000); lastT = t;
    if (moving){ const n = 6; for (let i=0;i<n && moving;i++) physics(dt/n); }
    if (sunk && sink < 0.5){ sink += dt; if (sink >= 0.5){ save(); holeDone(false); } }
    if (splash > 0) splash = Math.max(0, splash - dt);
    draw();
    raf = requestAnimationFrame(loop);
  }
  hud();
  if (st.hole >= 3 || fin()){
    el.querySelector('#stage').hidden = true; el.querySelector('.hint').hidden = true; el.querySelector('#hud').hidden = true;
    const prev = api.existing(); if (prev) api.show(prev); else finishRound();
  } else raf = requestAnimationFrame(loop);
  return () => { cancelAnimationFrame(raf); if (!fin() && st.hole < 3 && !moving) save(); };
}

/* =================================================================
   TIMELINE
   ================================================================= */
function mountTimeline(el, api){
  const r = rngFor('timeline');
  let picks = null;
  for (let t=0; t<300 && !picks; t++){
    const c = shuffle(EVENTS.slice(), r).slice(0,5);
    const ys = c.map(e => e[0]).sort((a,b) => a-b);
    if (ys.every((y,i) => i===0 || y - ys[i-1] >= 8)) picks = c;
  }
  if (!picks) picks = EVENTS.slice(0,5);
  const sorted = picks.slice().sort((a,b) => a[0]-b[0]);
  const MAXT = 3, key = stateKey('timeline');
  let st = store.get(key, null);
  if (!st){
    let order; do { order = shuffle([0,1,2,3,4], r); } while (order.every((v,i) => picks[v] === sorted[i]));
    st = {order, locked:[false,false,false,false,false], attempts:[], started:false};
  }
  let sel = null, msg = '', msgCls = '';
  const yr = y => y < 0 ? (-y) + ' BC' : String(y);
  const save = () => store.set(key, st);
  function render(){
    const fin = !!api.existing();
    const view = fin ? sorted.map((e,pos) => ({e, ok: true, right: picks[st.order[pos]] === e}))
                     : st.order.map((pi,pos) => ({e: picks[pi], ok: st.locked[pos]}));
    el.innerHTML = `
      <div class="tlend"><span class="label">Earliest</span><span class="tries" aria-label="${st.attempts.length} of ${MAXT} checks used">${Array.from({length:MAXT},(_,i)=>`<i class="${i<st.attempts.length?'u':''}"></i>`).join('')}</span></div>
      <ol class="tl" id="tl">${view.map((v,pos) => {
        const lock = fin || v.ok;
        const cls = fin ? (v.right ? 'ok' : 'no') : (v.ok ? 'ok' : (sel===pos ? 'sel' : ''));
        return `<li class="tli ${cls}">
          <div class="mv">${lock ? '' : `<button data-up="${pos}" aria-label="Move up" ${canMove(pos,-1)?'':'disabled'}>▲</button><button data-dn="${pos}" aria-label="Move down" ${canMove(pos,1)?'':'disabled'}>▼</button>`}</div>
          <button class="tlt" data-pos="${pos}" ${lock?'disabled':''}>${esc(v.e[1])}</button>
          <span class="yr">${lock ? yr(v.e[0]) : ''}</span></li>`; }).join('')}</ol>
      <div class="tlend"><span class="label">Latest</span><span></span></div>
      <p class="msg ${msgCls}" aria-live="polite">${esc(msg)}</p>
      ${fin ? (api.existing().won ? '' : `<p class="hint">This is the correct order. Red rows were out of place on your last check.</p>`) : `<div class="row" style="justify-content:center"><button class="btn primary" id="tlcheck">Check order</button></div>`}`;
    if (fin) return;
    el.querySelector('#tl').onclick = e => {
      const up = e.target.closest('[data-up]'), dn = e.target.closest('[data-dn]'), t = e.target.closest('.tlt');
      if (up) shift(+up.dataset.up, -1); else if (dn) shift(+dn.dataset.dn, 1); else if (t) tap(+t.dataset.pos);
    };
    el.querySelector('#tlcheck').onclick = check;
  }
  function neighbour(pos, dir){ for (let j = pos+dir; j >= 0 && j < 5; j += dir) if (!st.locked[j]) return j; return -1; }
  function canMove(pos, dir){ return neighbour(pos, dir) !== -1; }
  function swap(a, b){ [st.order[a], st.order[b]] = [st.order[b], st.order[a]]; st.started = true; save(); }
  function shift(pos, dir){ const j = neighbour(pos, dir); if (j < 0) return; swap(pos, j); sel = null; msg=''; render(); }
  function tap(pos){ if (sel === null) sel = pos; else if (sel === pos) sel = null; else { swap(sel, pos); sel = null; } msg=''; render(); }
  function check(){
    st.started = true;
    const res = st.order.map((pi,pos) => picks[pi] === sorted[pos]);
    st.attempts.push(res); st.locked = res.slice(); sel = null; save();
    const n = res.filter(Boolean).length, used = st.attempts.length;
    const grid = st.attempts.map(a => a.map(x => x ? '🟩' : '⬜').join('')).join('\n');
    if (n === 5 || used >= MAXT){
      const won = n === 5;
      api.finish({score: used, won, title: won ? (used===1 ? 'Perfect recall' : 'In order') : 'Out of checks',
        detail: sorted.map(e => `${yr(e[0])}: ${e[1]}`).join(' · '),
        summary: won ? `${used}/${MAXT}` : `X/${MAXT}`,
        share: `Daybook Timeline No. ${DAY_NO}  ${won?used:'X'}/${MAXT}\n${grid}`});
      msg = ''; render(); return;
    }
    msg = `${n} of 5 in the right place. ${MAXT-used} check${MAXT-used===1?'':'s'} left.`; msgCls = '';
    render();
  }
  render();
  const prev = api.existing(); if (prev) api.show(prev);
}

/* =================================================================
   SWITCHBOARD
   ================================================================= */
function mountSwitch(el, api){
  const N = 5, r = rngFor('switch');
  let target;
  do { target = Array.from({length:N*N}, () => r() < 0.4 ? 1 : 0); } while (target.reduce((a,b)=>a+b,0) < 6);
  const par = 5 + Math.floor(r()*4);
  const presses = shuffle([...Array(N*N).keys()], r).slice(0, par);
  const flip = (b, i) => { const x = i % N, y = Math.floor(i / N); [[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy]) => { const nx = x+dx, ny = y+dy; if (nx>=0 && nx<N && ny>=0 && ny<N) b[ny*N+nx] ^= 1; }); };
  const start = target.slice(); presses.forEach(i => flip(start, i));
  const key = stateKey('switch');
  let st = store.get(key, null) || {moves:[], started:false, gaveUp:false};
  let arm = false, msg = '';
  const board = () => { const b = start.slice(); st.moves.forEach(i => flip(b, i)); return b; };
  function render(){
    const b = board(), fin = !!api.existing();
    const wrong = b.reduce((a,v,i) => a + (v !== target[i] ? 1 : 0), 0);
    const showSol = fin && st.gaveUp;
    el.innerHTML = `
      <div class="sw">
        <div class="swb" id="swb" role="grid" aria-label="Switchboard">${b.map((v,i) => `<button class="swc ${v?'on':''} ${!fin && v!==target[i]?'x':''} ${showSol && presses.includes(i)?'sol':''}" data-i="${i}" aria-label="Row ${Math.floor(i/N)+1}, column ${i%N+1}, ${v?'on':'off'}${v!==target[i]?', does not match':''}" ${fin?'disabled':''}></button>`).join('')}</div>
        <div class="swside">
          <div><span class="label">Match this</span><div class="swt" aria-hidden="true">${target.map(v => `<i class="${v?'on':''}"></i>`).join('')}</div></div>
          <div class="swstat"><span class="label">Presses</span><b>${st.moves.length}<span style="color:var(--muted);font-weight:500"> / par ${par}</span></b></div>
          <div class="swstat"><span class="label">Unmatched</span><b>${wrong}</b></div>
        </div>
      </div>
      <p class="msg" aria-live="polite">${esc(msg)}</p>
      ${fin ? (showSol ? `<p class="hint">Ringed switches are one solution: press each once, in any order.</p>` : '') : `<div class="row" style="justify-content:center">
        <button class="btn" id="swundo" ${st.moves.length?'':'disabled'}>Undo</button>
        <button class="btn" id="swreset" ${st.moves.length?'':'disabled'}>Start over</button>
        <button class="btn" id="swgive">${arm ? 'Tap again to give up' : 'Show solution'}</button>
      </div>`}`;
    if (fin) return;
    el.querySelector('#swb').onclick = e => { const c = e.target.closest('.swc'); if (!c) return; press(+c.dataset.i); };
    el.querySelector('#swundo').onclick = () => { st.moves.pop(); arm = false; msg=''; store.set(key, st); render(); };
    el.querySelector('#swreset').onclick = () => { st.moves = []; arm = false; msg=''; store.set(key, st); render(); };
    el.querySelector('#swgive').onclick = () => {
      if (!arm){ arm = true; render(); return; }
      st.gaveUp = true; store.set(key, st);
      api.finish({won:false, title:'Solution shown', detail:`It takes ${par} presses. The ringed switches show where.`, summary:'Gave up',
        share:`Daybook Switchboard No. ${DAY_NO}\nGave up after ${st.moves.length} press${st.moves.length===1?'':'es'} (par ${par})`});
      render();
    };
  }
  function press(i){
    arm = false; msg = '';
    if (st.moves.length && st.moves[st.moves.length-1] === i) st.moves.pop(); else st.moves.push(i);
    st.started = true; store.set(key, st);
    const b = board();
    if (b.every((v,k) => v === target[k])){
      const n = st.moves.length, stars = n <= par ? 3 : n <= par+4 ? 2 : 1;
      api.finish({score: n, won:true, title: n < par ? 'Under par' : n === par ? 'Wired right' : 'Matched',
        detail:`Matched in ${n} press${n===1?'':'es'}. Par was ${par}.`, summary:'★'.repeat(stars)+'☆'.repeat(3-stars),
        share:`Daybook Switchboard No. ${DAY_NO}\n${'★'.repeat(stars)}${'☆'.repeat(3-stars)}  ${n} press${n===1?'':'es'} (par ${par})`});
    }
    render();
  }
  render();
  const prev = api.existing(); if (prev) api.show(prev);
}

/* ===== 10-logic-a.js ===== */
/* Logic pack A: Sixes, Halves, Skyline, Eight Queens, Lockpick */

/* ================================================================
   Pure, seeded generators (no DOM). Each takes a PRNG r().
   ================================================================ */
const lgaPop = m => { let c = 0; while (m) { m &= m - 1; c++; } return c; };

/* ---- Sixes: 6x6, boxes of 2 rows x 3 cols ---- */
const SIX_BOX = i => Math.floor(Math.floor(i/6)/2)*2 + Math.floor((i%6)/3);
const SIX_PEERS = Array.from({length:36}, (_,i) => {
  const s = [];
  for (let k=0;k<36;k++) if (k!==i && (Math.floor(k/6)===Math.floor(i/6) || k%6===i%6 || SIX_BOX(k)===SIX_BOX(i))) s.push(k);
  return s;
});
function sixCands(g, i){ let m = 0b1111110; for (const k of SIX_PEERS[i]) if (g[k]) m &= ~(1 << g[k]); return m; }
function sixFill(g, r){
  const i = g.indexOf(0); if (i < 0) return true;
  const m = sixCands(g, i);
  for (const v of shuffle([1,2,3,4,5,6], r)) if (m & (1<<v)) { g[i] = v; if (sixFill(g, r)) return true; g[i] = 0; }
  return false;
}
function sixCount(g, limit){
  let best = -1, bm = 0, bc = 9;
  for (let i=0;i<36;i++) if (!g[i]) { const m = sixCands(g, i), c = lgaPop(m); if (!c) return 0; if (c < bc) { bc = c; best = i; bm = m; } }
  if (best < 0) return 1;
  let n = 0;
  for (let v=1; v<=6 && n<limit; v++) if (bm & (1<<v)) { g[best] = v; n += sixCount(g, limit - n); g[best] = 0; }
  return n;
}
function genSixes(r){
  const sol = new Array(36).fill(0); sixFill(sol, r);
  const puz = sol.slice(), target = 14 + Math.floor(r()*3);
  let givens = 36;
  for (const i of shuffle([...Array(36).keys()], r)){
    if (givens <= target) break;
    const v = puz[i]; puz[i] = 0;
    if (sixCount(puz.slice(), 2) !== 1) puz[i] = v; else givens--;
  }
  return {sol, puz, givens};
}

/* ---- Halves: 6x6 binary ---- */
const HALF_ROWS = (() => {
  const out = [];
  for (let m=0;m<64;m++){
    const a = [...Array(6)].map((_,i) => (m>>i)&1);
    if (a.reduce((x,y)=>x+y,0) !== 3) continue;
    let ok = true; for (let i=2;i<6;i++) if (a[i]===a[i-1] && a[i]===a[i-2]) ok = false;
    if (ok) out.push(a);
  }
  return out;
})();
function halfColsOk(rows, final){
  const n = rows.length;
  for (let c=0;c<6;c++){
    let ones = 0; for (let k=0;k<n;k++) ones += rows[k][c];
    if (ones > 3 || n - ones > 3) return false;
    if (n >= 3 && rows[n-1][c] === rows[n-2][c] && rows[n-1][c] === rows[n-3][c]) return false;
  }
  if (final){ const cols = [...Array(6)].map((_,c) => rows.map(x => x[c]).join('')); if (new Set(cols).size < 6) return false; }
  return true;
}
function halfFill(rows, r){
  if (rows.length === 6) return true;
  for (const cand of shuffle(HALF_ROWS.slice(), r)){
    if (rows.includes(cand)) continue;
    rows.push(cand);
    if (halfColsOk(rows, rows.length === 6) && halfFill(rows, r)) return true;
    rows.pop();
  }
  return false;
}
function halfCount(puz, limit){
  let n = 0; const rows = [];
  const cands = [...Array(6)].map((_,ri) => HALF_ROWS.filter(a => a.every((v,c) => puz[ri*6+c] < 0 || puz[ri*6+c] === v)));
  (function go(){
    if (n >= limit) return;
    const k = rows.length;
    if (k === 6){ n++; return; }
    for (const cand of cands[k]){
      if (rows.includes(cand)) continue;
      rows.push(cand);
      if (halfColsOk(rows, k === 5)) go();
      rows.pop();
      if (n >= limit) return;
    }
  })();
  return n;
}
function genHalves(r){
  const rows = []; if (!halfFill(rows, r)) { rows.length = 0; halfFill(rows, mulberry32(7)); }
  const sol = rows.flat(), puz = sol.slice(), target = 11 + Math.floor(r()*3);
  let givens = 36;
  for (const i of shuffle([...Array(36).keys()], r)){
    if (givens <= target) break;
    const v = puz[i]; puz[i] = -1;
    if (halfCount(puz, 2) !== 1) puz[i] = v; else givens--;
  }
  return {sol, puz, givens};
}

/* ---- Skyline: 5x5 skyscrapers ---- */
const skyVis = a => { let m = 0, c = 0; for (const v of a) if (v > m) { m = v; c++; } return c; };
function skyLines(g, N){
  const row = k => g.slice(k*N, k*N+N), col = k => [...Array(N)].map((_,j) => g[j*N+k]);
  return {
    top: [...Array(N)].map((_,k) => col(k)), bottom: [...Array(N)].map((_,k) => col(k).reverse()),
    left: [...Array(N)].map((_,k) => row(k)), right: [...Array(N)].map((_,k) => row(k).reverse())
  };
}
function skyFillLatin(g, N, r){
  const i = g.indexOf(0); if (i < 0) return true;
  const rr = Math.floor(i/N), cc = i%N;
  for (const v of shuffle([...Array(N)].map((_,k)=>k+1), r)){
    let ok = true;
    for (let k=0;k<N;k++) if (g[rr*N+k] === v || g[k*N+cc] === v) { ok = false; break; }
    if (ok){ g[i] = v; if (skyFillLatin(g, N, r)) return true; g[i] = 0; }
  }
  return false;
}
function skyCount(cl, giv, N, limit){
  const g = new Array(N*N).fill(0), ru = new Array(N).fill(0), cu = new Array(N).fill(0);
  let n = 0;
  const prefOk = (get, len, clue) => {
    if (clue == null) return true;
    let m = 0, c = 0; for (let k=0;k<len;k++){ const v = get(k); if (v > m) { m = v; c++; } }
    if (c > clue) return false;
    if (m === N && c !== clue) return false;
    return true;
  };
  (function go(i){
    if (n >= limit) return;
    if (i === N*N){ n++; return; }
    const rr = Math.floor(i/N), cc = i%N;
    for (let v=1; v<=N; v++){
      if (giv[i] && giv[i] !== v) continue;
      const bit = 1<<v; if ((ru[rr] & bit) || (cu[cc] & bit)) continue;
      g[i] = v;
      let ok = prefOk(k => g[rr*N+k], cc+1, cl.left[rr]) && prefOk(k => g[k*N+cc], rr+1, cl.top[cc]);
      if (ok && cc === N-1 && cl.right[rr] != null){ let m=0,c=0; for (let k=N-1;k>=0;k--){ const x = g[rr*N+k]; if (x>m){m=x;c++;} } ok = c === cl.right[rr]; }
      if (ok && rr === N-1 && cl.bottom[cc] != null){ let m=0,c=0; for (let k=N-1;k>=0;k--){ const x = g[k*N+cc]; if (x>m){m=x;c++;} } ok = c === cl.bottom[cc]; }
      if (ok){ ru[rr] |= bit; cu[cc] |= bit; go(i+1); ru[rr] &= ~bit; cu[cc] &= ~bit; }
      g[i] = 0;
      if (n >= limit) return;
    }
  })(0);
  return n;
}
function genSkyline(r){
  const N = 5, sol = new Array(N*N).fill(0); skyFillLatin(sol, N, r);
  const L = skyLines(sol, N);
  const clues = {top:L.top.map(skyVis), bottom:L.bottom.map(skyVis), left:L.left.map(skyVis), right:L.right.map(skyVis)};
  const giv = new Array(N*N).fill(0);
  // Rarely the full clue set is ambiguous: add given cells until unique.
  const order = shuffle([...Array(N*N).keys()], r);
  for (let k=0; skyCount(clues, giv, N, 2) !== 1 && k < order.length; k++) giv[order[k]] = sol[order[k]];
  for (const i of order) if (giv[i]) { giv[i] = 0; if (skyCount(clues, giv, N, 2) !== 1) giv[i] = sol[i]; }
  // Then hide clues while the answer stays unique.
  const slots = shuffle(['top','bottom','left','right'].flatMap(s => [...Array(N)].map((_,k) => [s,k])), r);
  const minClues = 12 + Math.floor(r()*3);
  let shown = 20;
  for (const [s,k] of slots){
    if (shown <= minClues) break;
    const v = clues[s][k]; clues[s][k] = null;
    if (skyCount(clues, giv, N, 2) !== 1) clues[s][k] = v; else shown--;
  }
  return {sol, clues, giv, shown};
}

/* ---- Eight Queens ---- */
const QUEEN_SOLS = (() => {
  const out = [], cols = [];
  (function go(r){
    if (r === 8){ out.push(cols.slice()); return; }
    for (let c=0;c<8;c++){
      if (cols.some((cc,rr) => cc === c || Math.abs(cc - c) === r - rr)) continue;
      cols.push(c); go(r+1); cols.pop();
    }
  })(0);
  return out;
})();
function genQueens(r){
  const sol = QUEEN_SOLS[Math.floor(r()*QUEEN_SOLS.length)];
  const rows = shuffle([0,1,2,3,4,5,6,7], r).slice(0,2);
  return {sol: sol.map((c,row) => row*8+c), locked: rows.map(row => row*8 + sol[row])};
}
const queensAttack = (a, b) => { const ra = a>>3, ca = a&7, rb = b>>3, cb = b&7; return a !== b && (ra === rb || ca === cb || Math.abs(ra-rb) === Math.abs(ca-cb)); };

/* ---- Lockpick ---- */
const LOCK_COLORS = [
  {k:'R', name:'Red',    bg:'#E5484D', fg:'#FFFFFF'},
  {k:'O', name:'Orange', bg:'#F2903A', fg:'#1B1B1B'},
  {k:'Y', name:'Yellow', bg:'#F2D03B', fg:'#1B1B1B'},
  {k:'G', name:'Green',  bg:'#2F9E57', fg:'#FFFFFF'},
  {k:'B', name:'Blue',   bg:'#3B7BEA', fg:'#FFFFFF'},
  {k:'P', name:'Purple', bg:'#9B5DE5', fg:'#FFFFFF'}
];
function lockScore(code, guess){
  let x = 0; const a = [0,0,0,0,0,0], b = [0,0,0,0,0,0];
  for (let i=0;i<4;i++){ if (code[i] === guess[i]) x++; else { a[code[i]]++; b[guess[i]]++; } }
  let o = 0; for (let k=0;k<6;k++) o += Math.min(a[k], b[k]);
  return {x, o};
}
const genLock = r => [0,1,2,3].map(() => Math.floor(r()*6));

/* ================================================================
   Shared number-grid board (Sixes, Skyline)
   ================================================================ */
function lgaGrid(el, api, cfg){
  const N = cfg.N, NN = N*N, clues = cfg.clues;
  const fin = () => !!api.existing();
  let st = api.load(null);
  if (!st || !Array.isArray(st.grid) || st.grid.length !== NN){
    st = {grid: cfg.givens.slice(), notes: new Array(NN).fill(0), sel: Math.max(0, cfg.givens.indexOf(0)), notesMode: false, started: false};
  }
  let msg = '', msgCls = '', arm = false;
  const R = i => Math.floor(i/N), C = i => i%N;
  const box = i => cfg.box ? Math.floor(R(i)/cfg.box[0])*(N/cfg.box[1]) + Math.floor(C(i)/cfg.box[1]) : -1;
  const peer = (a, b) => a !== b && (R(a) === R(b) || C(a) === C(b) || (!!cfg.box && box(a) === box(b)));
  function conflicts(g){
    const bad = new Set();
    for (let a=0;a<NN;a++) if (g[a]) for (let b=a+1;b<NN;b++) if (g[b] === g[a] && peer(a,b)) { bad.add(a); bad.add(b); }
    return bad;
  }
  function lineOf(side, k, g){
    if (side === 'left') return g.slice(k*N, k*N+N);
    if (side === 'right') return g.slice(k*N, k*N+N).reverse();
    const col = [...Array(N)].map((_,j) => g[j*N+k]);
    return side === 'top' ? col : col.reverse();
  }
  function clueState(side, k, g){
    const c = clues[side][k]; if (c == null) return '';
    const line = lineOf(side, k, g);
    if (line.some(v => !v)) return '';
    return skyVis(line) === c ? 'ok' : 'no';
  }
  const save = () => api.save(st);
  const touch = () => { if (!st.started){ st.started = true; api.start(); } };

  function cellHtml(i, bad, f){
    const v = st.grid[i], given = !!cfg.givens[i], s = st.sel;
    const cls = ['lga-c', given ? 'g' : '',
      !f && i === s ? 'sel' : '',
      !f && s != null && peer(i, s) ? 'hl' : '',
      !f && v && s != null && st.grid[s] === v && i !== s ? 'same' : '',
      bad.has(i) ? 'bad' : '',
      cfg.box && C(i)%cfg.box[1] === cfg.box[1]-1 && C(i) < N-1 ? 'bR' : '',
      cfg.box && R(i)%cfg.box[0] === cfg.box[0]-1 && R(i) < N-1 ? 'bB' : '',
      C(i) === N-1 ? 'eR' : '', R(i) === N-1 ? 'eB' : ''].join(' ');
    const notes = st.notes[i];
    const inner = v ? v : (notes ? `<span class="lga-notes">${[...Array(N)].map((_,d) => `<span>${notes & (1<<(d+1)) ? d+1 : ''}</span>`).join('')}</span>` : '');
    return `<button class="${cls}" data-i="${i}" aria-label="Row ${R(i)+1}, column ${C(i)+1}, ${v || 'empty'}${given ? ', given' : ''}" ${f ? 'disabled' : ''}>${inner}</button>`;
  }
  function render(){
    const f = fin(), bad = conflicts(st.grid);
    const hadFocus = el.contains(document.activeElement) && document.activeElement.classList.contains('lga-c');
    let board;
    if (clues){
      const cl = (side, k) => `<span class="lga-clue ${clueState(side, k, st.grid)}" aria-label="${side} clue ${clues[side][k] ?? 'none'}">${clues[side][k] ?? ''}</span>`;
      const parts = ['<span></span>', ...[...Array(N)].map((_,k) => cl('top',k)), '<span></span>'];
      for (let rr=0; rr<N; rr++){ parts.push(cl('left', rr)); for (let cc=0; cc<N; cc++) parts.push(cellHtml(rr*N+cc, bad, f)); parts.push(cl('right', rr)); }
      parts.push('<span></span>', ...[...Array(N)].map((_,k) => cl('bottom',k)), '<span></span>');
      board = `<div class="lga-board open" id="lgab" style="--n:${N+2}">${parts.join('')}</div>`;
    } else {
      board = `<div class="lga-board boxed" id="lgab" style="--n:${N}">${[...Array(NN)].map((_,i) => cellHtml(i, bad, f)).join('')}</div>`;
    }
    el.innerHTML = `<div class="lga-wrap">
      ${board}
      ${f ? '' : `<div class="lga-pad" id="lgap" style="--k:${N}">${[...Array(N)].map((_,d) => `<button data-d="${d+1}" aria-label="Enter ${d+1}">${d+1}</button>`).join('')}</div>
      <div class="lga-pad" id="lgat" style="--k:2"><button class="lga-tool ${st.notesMode ? 'on' : ''}" data-t="notes" aria-pressed="${st.notesMode}">Notes ${st.notesMode ? 'on' : 'off'}</button><button class="lga-tool" data-t="erase">Erase</button></div>`}
      <p class="msg ${msgCls}" aria-live="polite">${esc(msg)}</p>
      ${f ? '' : `<div class="row" style="justify-content:center"><button class="btn" id="lgag">${arm ? 'Tap again to give up' : 'Show solution'}</button></div>`}
    </div>`;
    if (f) return;
    el.querySelector('#lgab').onclick = e => { const b = e.target.closest('.lga-c'); if (!b) return; st.sel = +b.dataset.i; arm = false; render(); };
    el.querySelector('#lgap').onclick = e => { const b = e.target.closest('[data-d]'); if (b) setDigit(+b.dataset.d); };
    el.querySelector('#lgat').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; if (b.dataset.t === 'notes'){ st.notesMode = !st.notesMode; save(); render(); } else erase(); };
    el.querySelector('#lgag').onclick = giveUp;
    if (hadFocus){ const c = el.querySelector(`.lga-c[data-i="${st.sel}"]`); if (c) c.focus({preventScroll:true}); }
  }
  function setDigit(d){
    if (fin()) return;
    const i = st.sel; if (i == null || cfg.givens[i]) return;
    touch(); arm = false; msg = ''; msgCls = '';
    if (st.notesMode && !st.grid[i]) st.notes[i] ^= (1<<d);
    else {
      st.grid[i] = st.grid[i] === d ? 0 : d; st.notes[i] = 0;
      if (st.grid[i]) for (let k=0;k<NN;k++) if (peer(i,k)) st.notes[k] &= ~(1<<d);
    }
    save(); check(); render();
  }
  function erase(){
    if (fin()) return;
    const i = st.sel; if (i == null || cfg.givens[i]) return;
    touch(); st.grid[i] = 0; st.notes[i] = 0; msg = ''; save(); render();
  }
  function move(dr, dc){
    const i = st.sel == null ? 0 : st.sel;
    st.sel = ((R(i)+dr+N)%N)*N + (C(i)+dc+N)%N; render();
  }
  function check(){
    if (st.grid.some(v => !v)) return;
    if (conflicts(st.grid).size === 0 && cfg.accept(st.grid)){
      save();
      api.finish({won: true, title: 'Solved', detail: cfg.detail, summary: 'Solved',
        share: `Daybook ${cfg.name} No. ${DAY_NO}\n${cfg.shareLine}`});
      return;
    }
    msg = cfg.clues ? 'Every square is filled, but a row, column or clue doesn’t add up.' : 'Every square is filled, but something breaks a rule.';
    msgCls = 'bad';
  }
  function giveUp(){
    if (!arm){ arm = true; render(); return; }
    st.grid = cfg.solution.slice(); st.notes = new Array(NN).fill(0); st.gaveUp = true; st.started = true; save();
    api.finish({won: false, title: 'Solution shown', detail: 'Here is the full grid. A fresh one arrives tomorrow.', summary: 'Gave up',
      share: `Daybook ${cfg.name} No. ${DAY_NO}\nGave up`});
    render();
  }
  const onKey = e => {
    if (fin() || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (/^[1-9]$/.test(e.key) && +e.key <= N){ e.preventDefault(); setDigit(+e.key); }
    else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0'){ e.preventDefault(); erase(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); move(-1,0); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); move(1,0); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); move(0,-1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); move(0,1); }
    else if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); st.notesMode = !st.notesMode; save(); render(); }
  };
  document.addEventListener('keydown', onKey);
  render();
  const prev = api.existing(); if (prev) api.show(prev);
  return () => document.removeEventListener('keydown', onKey);
}

function mountSixes(el, api){
  const {sol, puz, givens} = genSixes(api.rng());
  return lgaGrid(el, api, {N:6, box:[2,3], givens:puz, solution:sol, name:'Sixes',

    shareLine: `▦ 6×6 solved from ${givens} givens`});
}

/* ================================================================
   Halves
   ================================================================ */
function mountHalves(el, api){
  const {sol, puz, givens} = genHalves(api.rng());
  const fin = () => !!api.existing();
  let st = api.load(null);
  if (!st || !Array.isArray(st.grid) || st.grid.length !== 36) st = {grid: puz.slice(), sel: null, started: false};
  let msg = '', msgCls = '', arm = false;
  const LINES = [];
  for (let k=0;k<6;k++){ LINES.push([...Array(6)].map((_,j) => k*6+j)); LINES.push([...Array(6)].map((_,j) => j*6+k)); }
  function violations(g){
    const bad = new Set();
    for (const L of LINES){
      for (let j=2;j<6;j++){ const a = g[L[j]]; if (a >= 0 && a === g[L[j-1]] && a === g[L[j-2]]) { bad.add(L[j]); bad.add(L[j-1]); bad.add(L[j-2]); } }
      for (const v of [0,1]){ const cells = L.filter(i => g[i] === v); if (cells.length > 3) cells.forEach(i => bad.add(i)); }
    }
    for (let t=0;t<2;t++){
      const ls = LINES.filter((_,idx) => idx%2 === t);
      for (let a=0;a<6;a++) for (let b=a+1;b<6;b++){
        const A = ls[a].map(i => g[i]), B = ls[b].map(i => g[i]);
        if (A.every(x => x >= 0) && A.join() === B.join()){ ls[a].forEach(i => bad.add(i)); ls[b].forEach(i => bad.add(i)); }
      }
    }
    return bad;
  }
  const sym = v => v === 1 ? '<span class="halves-sun"></span>' : v === 0 ? '<span class="halves-moon"></span>' : '';
  const NAME = v => v === 1 ? 'filled' : v === 0 ? 'hollow' : 'empty';
  function render(){
    const f = fin(), bad = violations(st.grid);
    el.innerHTML = `<div class="lga-wrap">
      <div class="halves-board" id="hb">${st.grid.map((v,i) => `<button class="halves-c ${puz[i] >= 0 ? 'g' : ''} ${bad.has(i) ? 'bad' : ''} ${!f && st.sel === i ? 'sel' : ''}" data-i="${i}" aria-label="Row ${Math.floor(i/6)+1}, column ${i%6+1}, ${NAME(v)}${puz[i] >= 0 ? ', given' : ''}" ${f ? 'disabled' : ''}>${sym(v)}</button>`).join('')}</div>
      <div class="halves-key"><span><i class="halves-sun"></i> Filled: 3 per line</span><span><i class="halves-moon"></i> Hollow: 3 per line</span></div>
      <p class="msg ${msgCls}" aria-live="polite">${esc(msg)}</p>
      ${f ? '' : `<div class="row" style="justify-content:center"><button class="btn" id="hgive">${arm ? 'Tap again to give up' : 'Show solution'}</button></div>`}
    </div>`;
    if (f) return;
    el.querySelector('#hb').onclick = e => { const b = e.target.closest('.halves-c'); if (b) tap(+b.dataset.i, null); };
    el.querySelector('#hgive').onclick = () => {
      if (!arm){ arm = true; render(); return; }
      st.grid = sol.slice(); st.started = true; api.save(st);
      api.finish({won:false, title:'Solution shown', detail:'Here is the full grid. A fresh one arrives tomorrow.', summary:'Gave up', share:`Daybook Halves No. ${DAY_NO}\nGave up`});
      render();
    };
  }
  function tap(i, val){
    if (fin() || puz[i] >= 0) return;
    if (!st.started){ st.started = true; api.start(); }
    arm = false; msg = ''; msgCls = '';
    const g = st.grid[i];
    st.grid[i] = val !== null ? val : (g < 0 ? 1 : g === 1 ? 0 : -1);
    st.sel = i; api.save(st);
    if (st.grid.every(v => v >= 0)){
      if (violations(st.grid).size === 0){
        api.finish({won:true, title:'Balanced', detail:`Every row and column splits three and three, with no runs of three. You started from ${givens} givens.`,
          summary:'Solved', share:`Daybook Halves No. ${DAY_NO}\n◐ 6×6 balanced from ${givens} givens`});
      } else { msg = 'The board is full, but the red squares break a rule.'; msgCls = 'bad'; }
    }
    render();
  }
  const onKey = e => {
    if (fin() || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    const s = st.sel == null ? 0 : st.sel;
    const mv = {ArrowUp:-6, ArrowDown:6, ArrowLeft:-1, ArrowRight:1}[e.key];
    if (mv){ e.preventDefault(); let n = s + mv; if (e.key === 'ArrowLeft' && s%6 === 0) n = s+5; if (e.key === 'ArrowRight' && s%6 === 5) n = s-5; st.sel = (n+36)%36; render(); return; }
    if (st.sel == null) return;
    if (e.key === '1' || e.key === 'z'){ e.preventDefault(); tap(st.sel, 1); }
    else if (e.key === '2' || e.key === 'x'){ e.preventDefault(); tap(st.sel, 0); }
    else if (e.key === ' '){ e.preventDefault(); tap(st.sel, null); }
    else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0'){ e.preventDefault(); tap(st.sel, -1); }
  };
  document.addEventListener('keydown', onKey);
  render();
  const prev = api.existing(); if (prev) api.show(prev);
  return () => document.removeEventListener('keydown', onKey);
}

/* ================================================================
   Eight Queens
   ================================================================ */
const QUEEN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 7.5l4.6 4.2L12 4l4.4 7.7L21 7.5 19 18H5z"/><rect x="5" y="19.2" width="14" height="2.6" rx="1.2" fill="currentColor"/></svg>';
function mountQueens(el, api){
  const {sol, locked} = genQueens(api.rng());
  const fin = () => !!api.existing();
  let st = api.load(null);
  if (!st || !Array.isArray(st.queens)) st = {queens: locked.slice(), moves: 0, shade: false, started: false};
  let msg = '', msgCls = '', arm = false;
  function bad(){ const s = new Set(); st.queens.forEach(a => st.queens.forEach(b => { if (queensAttack(a,b)) { s.add(a); s.add(b); } })); return s; }
  function render(){
    const f = fin(), b = bad(), q = new Set(st.queens);
    const att = new Set(); if (st.shade && !f) for (let i=0;i<64;i++) if (!q.has(i) && st.queens.some(a => queensAttack(a, i))) att.add(i);
    el.innerHTML = `<div class="lga-wrap">
      <div class="queens-status"><b>${st.queens.length}<span style="color:var(--muted);font-weight:500"> of 8 queens</span></b>
        ${f ? '' : `<label class="queens-tog"><input type="checkbox" id="qshade" ${st.shade ? 'checked' : ''}> Shade attacked squares</label>`}</div>
      <div class="queens-board" id="qb">${[...Array(64)].map((_,i) => {
        const r = i>>3, c = i&7, has = q.has(i), lk = locked.includes(i);
        const cls = ['queens-c', (r+c)%2 ? 'dk' : '', has && lk ? 'lock' : '', has && b.has(i) ? 'bad' : '', att.has(i) ? 'att' : ''].join(' ');
        return `<button class="${cls}" data-i="${i}" aria-label="${'ABCDEFGH'[c]}${8-r}${has ? (lk ? ', fixed queen' : ', queen') : ''}${has && b.has(i) ? ', under attack' : ''}" ${f || lk ? 'disabled' : ''}>${has ? QUEEN_SVG : ''}</button>`;
      }).join('')}</div>
      <p class="msg ${msgCls}" aria-live="polite">${esc(msg)}</p>
      ${f ? '' : `<div class="row" style="justify-content:center"><button class="btn" id="qclear" ${st.queens.length > locked.length ? '' : 'disabled'}>Clear my queens</button><button class="btn" id="qgive">${arm ? 'Tap again to give up' : 'Show a solution'}</button></div>`}
    </div>`;
    if (f) return;
    el.querySelector('#qb').onclick = e => { const x = e.target.closest('.queens-c'); if (x) tap(+x.dataset.i); };
    el.querySelector('#qshade').onchange = e => { st.shade = e.target.checked; api.save(st); render(); };
    el.querySelector('#qclear').onclick = () => { st.queens = locked.slice(); arm = false; msg = ''; api.save(st); render(); };
    el.querySelector('#qgive').onclick = () => {
      if (!arm){ arm = true; render(); return; }
      st.queens = sol.slice(); st.started = true; api.save(st);
      api.finish({won:false, title:'Solution shown', detail:'Here is one way to place all eight. There are 92 in total.', summary:'Gave up', share:`Daybook Eight Queens No. ${DAY_NO}\nGave up`});
      render();
    };
  }
  function tap(i){
    if (fin() || locked.includes(i)) return;
    if (!st.started){ st.started = true; api.start(); }
    arm = false; msg = ''; msgCls = '';
    const at = st.queens.indexOf(i);
    if (at >= 0) st.queens.splice(at, 1);
    else if (st.queens.length >= 8){ msg = 'All eight queens are out. Remove one first.'; msgCls = 'bad'; render(); return; }
    else st.queens.push(i);
    st.moves++; api.save(st);
    if (st.queens.length === 8){
      if (bad().size === 0){
        api.finish({score: st.moves, won:true, title:'Eight safe queens', detail:`No queen attacks another. You made ${plural(st.moves,'move')}.`, summary:'Solved',
          share:`Daybook Eight Queens No. ${DAY_NO}\n♛ all eight safe in ${plural(st.moves,'move')}`});
      } else { msg = 'Eight queens, but the red ones can attack each other.'; msgCls = 'bad'; }
    }
    render();
  }
  render();
  const prev = api.existing(); if (prev) api.show(prev);
}

/* ================================================================
   Lockpick
   ================================================================ */
function mountLockpick(el, api){
  const code = genLock(api.rng());
  const MAX = 8;
  const fin = () => !!api.existing();
  let st = api.load(null);
  if (!st || !Array.isArray(st.guesses)) st = {guesses: [], cur: [-1,-1,-1,-1], sel: 0, started: false};
  let msg = '', msgCls = '';
  const peg = c => { const k = LOCK_COLORS[c]; return `<span class="lock-peg" style="background:${k.bg};color:${k.fg}">${k.k}</span>`; };
  const pins = s => `<span class="lock-pins" aria-label="${s.x} right place, ${s.o} wrong place">${[...Array(4)].map((_,k) => `<i class="lock-pin ${k < s.x ? 'x' : k < s.x+s.o ? 'o' : ''}"></i>`).join('')}</span>`;
  function render(){
    const f = fin(), n = st.guesses.length;
    const rows = [];
    if (f) rows.push(`<div class="lock-row code"><span class="lock-n">★</span>${code.map(c => `<span class="lock-slot f">${peg(c)}</span>`).join('')}<span class="label" style="text-align:center">Code</span></div>`);
    for (let i=0;i<MAX;i++){
      if (i < n){
        const g = st.guesses[i];
        rows.push(`<div class="lock-row"><span class="lock-n">${i+1}</span>${g.map(c => `<span class="lock-slot f">${peg(c)}</span>`).join('')}${pins(lockScore(code, g))}</div>`);
      } else if (i === n && !f){
        rows.push(`<div class="lock-row cur" id="lcur"><span class="lock-n">${i+1}</span>${st.cur.map((c,k) => `<button class="lock-slot ${c >= 0 ? 'f' : ''} ${st.sel === k ? 'sel' : ''}" data-s="${k}" aria-label="Slot ${k+1}${c >= 0 ? ', ' + LOCK_COLORS[c].name : ', empty'}">${c >= 0 ? peg(c) : ''}</button>`).join('')}<span></span></div>`);
      } else {
        rows.push(`<div class="lock-row"><span class="lock-n">${i+1}</span>${'<span class="lock-slot"></span>'.repeat(4)}<span></span></div>`);
      }
    }
    el.innerHTML = `<div class="lga-wrap">
      <div class="lock-rows">${rows.join('')}</div>
      <div class="lock-legend"><span><i class="lock-pin x"></i> right colour, right place</span><span><i class="lock-pin o"></i> right colour, wrong place</span></div>
      ${f ? '' : `<div class="lock-pal" id="lpal">${LOCK_COLORS.map((c,k) => `<button data-c="${k}" aria-label="${c.name} (${c.k})">${peg(k)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn" id="ldel">Delete</button><button class="btn primary" id="lgo" ${st.cur.every(c => c >= 0) ? '' : 'disabled'}>Try code</button></div>`}
      <p class="msg ${msgCls}" aria-live="polite">${esc(msg)}</p>
    </div>`;
    if (f) return;
    el.querySelector('#lcur').onclick = e => { const b = e.target.closest('[data-s]'); if (b){ st.sel = +b.dataset.s; render(); } };
    el.querySelector('#lpal').onclick = e => { const b = e.target.closest('[data-c]'); if (b) place(+b.dataset.c); };
    el.querySelector('#ldel').onclick = del;
    el.querySelector('#lgo').onclick = submit;
  }
  function place(c){
    if (fin()) return;
    if (!st.started){ st.started = true; api.start(); }
    msg = ''; st.cur[st.sel] = c;
    let nx = -1; for (let k=1;k<=4;k++){ const j = (st.sel + k) % 4; if (st.cur[j] < 0){ nx = j; break; } }
    if (nx >= 0) st.sel = nx; else if (st.sel < 3) st.sel++;
    api.save(st); render();
  }
  function del(){
    if (fin()) return;
    if (st.cur[st.sel] < 0 && st.sel > 0) st.sel--;
    st.cur[st.sel] = -1; api.save(st); render();
  }
  function submit(){
    if (fin()) return;
    if (st.cur.some(c => c < 0)){ msg = 'Fill all four slots first.'; msgCls = 'bad'; render(); return; }
    if (!st.started){ st.started = true; api.start(); }
    const g = st.cur.slice(); st.guesses.push(g); st.cur = [-1,-1,-1,-1]; st.sel = 0; api.save(st);
    const s = lockScore(code, g), n = st.guesses.length;
    if (s.x === 4 || n >= MAX){
      const won = s.x === 4;
      const lines = st.guesses.map(x => { const q = lockScore(code, x); return '●'.repeat(q.x) + '○'.repeat(q.o) + '·'.repeat(4 - q.x - q.o); }).join('\n');
      const codeTxt = code.map(c => LOCK_COLORS[c].name).join(', ');
      api.finish({score: n, won, title: won ? (n <= 3 ? 'Picked clean' : 'Unlocked') : 'Still locked',
        detail: won ? `You opened it in ${plural(n,'try','tries')}. The code was ${codeTxt}.` : `The code was ${codeTxt}.`,
        summary: won ? `${n}/${MAX}` : `X/${MAX}`,
        share: `Daybook Lockpick No. ${DAY_NO}  ${won ? n : 'X'}/${MAX}\n${lines}`});
    } else { msg = `${plural(s.x,'peg')} in the right place, ${s.o} more of the right colour. ${plural(MAX - n,'try','tries')} left.`; msgCls = ''; }
    render();
  }
  const onKey = e => {
    if (fin() || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    const k = LOCK_COLORS.findIndex(c => c.k === e.key.toUpperCase());
    if (k >= 0){ e.preventDefault(); place(k); }
    else if (e.key === 'Backspace' || e.key === 'Delete'){ e.preventDefault(); del(); }
    else if (e.key === 'Enter'){ e.preventDefault(); submit(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); st.sel = (st.sel+3)%4; render(); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); st.sel = (st.sel+1)%4; render(); }
  };
  document.addEventListener('keydown', onKey);
  render();
  const prev = api.existing(); if (prev) api.show(prev);
  return () => document.removeEventListener('keydown', onKey);
}

/* =================================================================
   PIXEL
   ================================================================= */
const PIXEL_N = 10;
function pixelRuns(line){ const out = []; let c = 0; for (const v of line){ if (v === 1) c++; else if (c){ out.push(c); c = 0; } } if (c) out.push(c); return out.length ? out : [0]; }
function genPixel(r){
  const N = PIXEL_N;
  for (let t = 0; t < 80; t++){
    let g = new Array(N*N).fill(0);
    const p = 0.5 + r()*0.12;
    for (let i = 0; i < N*N; i++) g[i] = r() < p ? 1 : 0;
    for (let it = 0; it < 2; it++){
      const ng = g.slice();
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
        let s = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ const yy = y+dy, xx = x+dx; if (yy >= 0 && yy < N && xx >= 0 && xx < N) s += g[yy*N+xx]; }
        ng[y*N+x] = s >= 5 ? 1 : s <= 3 ? 0 : g[y*N+x];
      }
      g = ng;
    }
    if (r() < 0.65){ for (let y = 0; y < N; y++) for (let x = 0; x < N/2; x++) g[y*N + (N-1-x)] = g[y*N+x]; }
    else { for (let y = 0; y < N/2; y++) for (let x = 0; x < N; x++) g[(N-1-y)*N + x] = g[y*N+x]; }
    const fill = g.reduce((a,b) => a+b, 0) / (N*N);
    if (fill < 0.45 || fill > 0.65) continue;
    let ok = true;
    for (let k = 0; k < N && ok; k++){
      let row = 0, col = 0;
      for (let j = 0; j < N; j++){ row += g[k*N+j]; col += g[j*N+k]; }
      if (!row || !col) ok = false;
    }
    if (ok) return g;
  }
  const heart = ['0110000110','1111001111','1111111111','1111111111','1111111111','0111111110','0011111100','0001111000','0000110000','0000110000'];
  return heart.join('').split('').map(Number);
}
function mountPixel(el, api){
  const N = PIXEL_N;
  const sol = genPixel(api.rng());
  const rowClues = Array.from({length:N}, (_,y) => pixelRuns(sol.slice(y*N, y*N+N)));
  const colClues = Array.from({length:N}, (_,x) => pixelRuns(Array.from({length:N}, (_,y) => sol[y*N+x])));
  const st = api.load(() => ({g:new Array(N*N).fill(0), mode:'fill', started:false, gaveUp:false}));
  const fin = () => !!api.existing();
  let armGive = false, armClear = false;
  const cells = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) cells.push(`<button class="pixel-cell c${x} r${y}" data-i="${y*N+x}" aria-label="Row ${y+1}, column ${x+1}"></button>`);
  let boardHtml = '<div></div>' + colClues.map((c,x) => `<div class="pixel-cc" id="pixel-cc${x}" aria-label="Column ${x+1} clue ${c.join(' ')}">${c.map(n => `<span>${n}</span>`).join('')}</div>`).join('');
  for (let y = 0; y < N; y++) boardHtml += `<div class="pixel-rc" id="pixel-rc${y}" aria-label="Row ${y+1} clue ${rowClues[y].join(' ')}">${rowClues[y].map(n => `<span>${n}</span>`).join('')}</div>` + cells.slice(y*N, y*N+N).join('');
  el.innerHTML = `
    <div class="pixel-wrap">
      <div class="pixel-tools" id="pixel-tools">
        <div class="pixel-seg" role="group" aria-label="Brush"><button data-mode="fill">■ Fill</button><button data-mode="mark">× Mark</button></div>
        <span class="label">Paint the picture the numbers describe</span>
      </div>
      <div class="pixel-board" id="pixel-board">${boardHtml}</div>
      <p class="msg" id="pixel-msg" aria-live="polite"></p>
      <div class="row" id="pixel-acts" style="justify-content:center"><button class="btn" id="pixel-clear">Clear board</button><button class="btn" id="pixel-give">Show solution</button></div>
      <p class="hint" id="pixel-hint">Drag across squares to paint several at once. Numbers turn grey when their line matches.</p>
    </div>`;
  const board = el.querySelector('#pixel-board');
  const cellEls = [...board.querySelectorAll('.pixel-cell')];
  const msgEl = el.querySelector('#pixel-msg');
  function paintCell(i){ const v = st.g[i], c = cellEls[i]; c.classList.toggle('f', v === 1); c.classList.toggle('x', v === 2); c.setAttribute('aria-label', `Row ${Math.floor(i/N)+1}, column ${i%N+1}, ${v===1?'filled':v===2?'marked empty':'blank'}`); }
  const lineOk = (vals, clue) => { const runs = pixelRuns(vals.map(v => v === 1 ? 1 : 0)); return runs.length === clue.length && runs.every((n,k) => n === clue[k]); };
  function checkLines(){
    let all = true;
    for (let k = 0; k < N; k++){
      const ro = lineOk(st.g.slice(k*N, k*N+N), rowClues[k]);
      const co = lineOk(Array.from({length:N}, (_,y) => st.g[y*N+k]), colClues[k]);
      el.querySelector('#pixel-rc'+k).classList.toggle('ok', ro);
      el.querySelector('#pixel-cc'+k).classList.toggle('ok', co);
      if (!ro || !co) all = false;
    }
    return all;
  }
  function setMode(m){ st.mode = m; el.querySelectorAll('.pixel-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m))); }
  function renderAll(){ cellEls.forEach((_,i) => paintCell(i)); checkLines(); setMode(st.mode || 'fill'); }
  function lock(){
    board.classList.add('done');
    cellEls.forEach(c => c.disabled = true);
    el.querySelector('#pixel-tools').hidden = true; el.querySelector('#pixel-acts').hidden = true; el.querySelector('#pixel-hint').hidden = true;
  }
  function commit(){
    if (fin()) return;
    st.started = true; api.save(st);
    if (checkLines()){
      st.g = st.g.map(v => v === 1 ? 1 : 0); api.save(st); renderAll(); lock();
      api.finish({won:true, title:'Picture painted', detail:`All ${N*2} clues line up. Nothing was penalised along the way.`, summary:'Solved',
        share:`Daybook Pixel No. ${DAY_NO}\n🎨 Painted the 10×10 picture`});
    }
  }
  let drag = null;
  function apply(i){
    if (!drag || drag.seen.has(i)) return;
    drag.seen.add(i);
    const cur = st.g[i];
    if (drag.want === 0 && cur !== drag.from) return;
    if (drag.want !== 0 && cur !== 0 && cur !== drag.from) return;
    st.g[i] = drag.want; paintCell(i);
  }
  board.addEventListener('pointerdown', e => {
    const c = e.target.closest('.pixel-cell'); if (!c || fin() || e.button > 0) return;
    e.preventDefault();
    const i = +c.dataset.i, cur = st.g[i];
    const want = st.mode === 'mark' ? (cur === 2 ? 0 : 2) : (cur === 1 ? 0 : 1);
    drag = {want, from:cur, seen:new Set()};
    apply(i);
    try { board.setPointerCapture(e.pointerId); } catch(err){}
  });
  board.addEventListener('pointermove', e => {
    if (!drag) return;
    const t = document.elementFromPoint(e.clientX, e.clientY);
    const c = t && t.closest ? t.closest('.pixel-cell') : null;
    if (c && board.contains(c)) apply(+c.dataset.i);
  });
  const endDrag = () => { if (drag){ drag = null; commit(); } };
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);
  board.addEventListener('click', e => {
    if (e.detail !== 0 || fin()) return; // keyboard activation only; pointer handled above
    const c = e.target.closest('.pixel-cell'); if (!c) return;
    const i = +c.dataset.i, cur = st.g[i];
    st.g[i] = st.mode === 'mark' ? (cur === 2 ? 0 : 2) : (cur === 1 ? 0 : 1);
    paintCell(i); commit();
  });
  board.addEventListener('keydown', e => {
    const c = e.target.closest('.pixel-cell'); if (!c) return;
    const i = +c.dataset.i; let j = -1;
    if (e.key === 'ArrowRight') j = i % N < N-1 ? i+1 : i; else if (e.key === 'ArrowLeft') j = i % N ? i-1 : i;
    else if (e.key === 'ArrowDown') j = i + N < N*N ? i+N : i; else if (e.key === 'ArrowUp') j = i - N >= 0 ? i-N : i;
    else if (e.key === 'x' || e.key === 'X'){ e.preventDefault(); st.g[i] = st.g[i] === 2 ? 0 : 2; paintCell(i); commit(); return; }
    if (j >= 0){ e.preventDefault(); cellEls[j].focus(); }
  });
  el.querySelector('.pixel-seg').onclick = e => { const b = e.target.closest('[data-mode]'); if (b){ setMode(b.dataset.mode); api.save(st); } };
  const giveBtn = el.querySelector('#pixel-give'), clearBtn = el.querySelector('#pixel-clear');
  clearBtn.onclick = () => {
    if (!armClear){ armClear = true; clearBtn.textContent = 'Tap again to clear'; return; }
    armClear = false; clearBtn.textContent = 'Clear board';
    st.g = new Array(N*N).fill(0); api.save(st); renderAll();
  };
  giveBtn.onclick = () => {
    if (!armGive){ armGive = true; giveBtn.textContent = 'Tap again to give up'; return; }
    st.gaveUp = true; st.started = true; st.g = sol.slice(); api.save(st); renderAll(); lock();
    api.finish({won:false, title:'Solution shown', detail:'Here is the picture the clues describe.', summary:'Gave up',
      share:`Daybook Pixel No. ${DAY_NO}\n🖼️ Peeked at the picture`});
  };
  renderAll();
  if (fin()){ if (st.gaveUp) st.g = sol.slice(); renderAll(); lock(); api.show(api.existing()); }
  return () => { drag = null; };
}

/* =================================================================
   SWEEP
   ================================================================= */
const SW_W = 9, SW_N = 81, SW_M = 12;
function sweepNb(i){ const x = i % SW_W, y = Math.floor(i / SW_W), out = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ if (!dx && !dy) continue; const xx = x+dx, yy = y+dy; if (xx >= 0 && xx < SW_W && yy >= 0 && yy < SW_W) out.push(yy*SW_W+xx); } return out; }
function sweepFlood(start, mine, count, open){
  const q = [start]; open[start] = true;
  while (q.length){ const i = q.pop(); if (count[i] === 0) for (const j of sweepNb(i)) if (!open[j] && !mine[j]){ open[j] = true; q.push(j); } }
}
function genSweep(r){
  let best = null;
  for (let t = 0; t < 40; t++){
    const s = Math.floor(r()*SW_N);
    const banned = new Set([s, ...sweepNb(s)]);
    const cand = shuffle([...Array(SW_N).keys()].filter(i => !banned.has(i)), r);
    const mine = new Array(SW_N).fill(false); cand.slice(0, SW_M).forEach(i => mine[i] = true);
    const count = Array.from({length:SW_N}, (_,i) => sweepNb(i).filter(j => mine[j]).length);
    const open = new Array(SW_N).fill(false); sweepFlood(s, mine, count, open);
    const size = open.filter(Boolean).length;
    if (!best || size > best.size) best = {mine, count, start:s, open, size};
    if (size >= 14) break;
  }
  return best;
}
function mountSweep(el, api){
  const B = genSweep(api.rng());
  const SAFE = SW_N - SW_M;
  const st = api.load(() => ({open:B.open.slice(), flag:new Array(SW_N).fill(false), boom:-1, flagMode:false, started:false}));
  const fin = () => !!api.existing();
  let lpTimer = 0, lpFired = false, lpStart = null;
  el.innerHTML = `
    <div class="sweep-wrap">
      <div class="sweep-top"><div><span class="label">Mines left</span><br><span class="sweep-count" id="sweep-count"></span></div>
        <button class="btn sweep-mode" id="sweep-mode" aria-pressed="false">⚑ Flag mode</button></div>
      <div class="sweep-board" id="sweep-board" role="grid" aria-label="Minefield, 9 by 9"></div>
      <p class="msg" id="sweep-msg" aria-live="polite"></p>
      <p class="hint" id="sweep-hint">Tap to dig. Long-press, right-click or press F to flag. Tap a number whose flags are all placed to clear around it.</p>
    </div>`;
  const board = el.querySelector('#sweep-board');
  const opened = () => st.open.filter(Boolean).length;
  function render(){
    const over = fin();
    const focused = document.activeElement && board.contains(document.activeElement) ? +document.activeElement.dataset.i : -1;
    board.innerHTML = Array.from({length:SW_N}, (_,i) => {
      const x = i % SW_W, y = Math.floor(i / SW_W);
      let cls = 'sweep-cell', txt = '', label;
      if (st.open[i]){ cls += ' open n' + B.count[i]; txt = B.count[i] || ''; label = B.count[i] ? `${B.count[i]} nearby` : 'clear'; }
      else if (over && B.mine[i]){ cls += i === st.boom ? ' boom' : ' mine'; txt = st.flag[i] ? '⚑' : '✸'; label = 'mine'; }
      else if (st.flag[i]){ cls += ' flag' + (over && !B.mine[i] ? ' wrong' : ''); txt = '⚑'; label = 'flagged'; }
      else label = 'hidden';
      return `<button class="${cls}" data-i="${i}" aria-label="Row ${y+1}, column ${x+1}, ${label}" ${over?'disabled':''}>${txt}</button>`;
    }).join('');
    el.querySelector('#sweep-count').textContent = SW_M - st.flag.filter(Boolean).length;
    const mb = el.querySelector('#sweep-mode'); mb.setAttribute('aria-pressed', String(!!st.flagMode)); mb.hidden = over;
    el.querySelector('#sweep-hint').hidden = over;
    if (focused >= 0 && !over) board.children[focused].focus();
  }
  function lose(i){
    st.boom = i; st.started = true; api.save(st);
    const left = SAFE - opened();
    api.finish({won:false, title:'Boom', detail:`That square hid a mine. You had ${plural(left,'safe square')} left to clear.`, summary:'Boom',
      share:`Daybook Sweep No. ${DAY_NO}\n💥 Hit a mine · ${left} safe left of ${SAFE}`});
    render();
  }
  function after(){
    st.started = true; api.save(st);
    if (opened() === SAFE){
      for (let i = 0; i < SW_N; i++) if (B.mine[i]) st.flag[i] = true;
      api.save(st);
      api.finish({won:true, title:'Field cleared', detail:`All ${SAFE} safe squares dug without touching a mine.`, summary:'Cleared',
        share:`Daybook Sweep No. ${DAY_NO}\n🚩 Cleared all ${SAFE} safe squares`});
    }
    render();
  }
  function dig(i){
    if (st.open[i] || st.flag[i]) return;
    if (B.mine[i]) return lose(i);
    sweepFlood(i, B.mine, B.count, st.open);
  }
  function toggleFlag(i){ if (fin() || st.open[i]) return; st.flag[i] = !st.flag[i]; after(); }
  function tap(i){
    if (fin()) return;
    if (st.flagMode && !st.open[i]) return toggleFlag(i);
    if (st.open[i]){
      if (!B.count[i]) return;
      const nb = sweepNb(i);
      if (nb.filter(j => st.flag[j]).length !== B.count[i]) { el.querySelector('#sweep-msg').textContent = `Place ${B.count[i]} flag${B.count[i]===1?'':'s'} around that number first.`; return; }
      for (const j of nb){ if (!st.open[j] && !st.flag[j]){ if (B.mine[j]) return lose(j); dig(j); } }
    } else {
      if (st.flag[i]) return;
      if (B.mine[i]) return lose(i);
      dig(i);
    }
    el.querySelector('#sweep-msg').textContent = '';
    after();
  }
  board.addEventListener('pointerdown', e => {
    lpFired = false; clearTimeout(lpTimer);
    const c = e.target.closest('.sweep-cell'); if (!c || e.button > 0 || fin()) return;
    const i = +c.dataset.i; lpStart = {x:e.clientX, y:e.clientY};
    lpTimer = setTimeout(() => { lpFired = true; toggleFlag(i); try { navigator.vibrate && navigator.vibrate(15); } catch(err){} }, 400);
  });
  board.addEventListener('pointermove', e => { if (lpStart && Math.hypot(e.clientX-lpStart.x, e.clientY-lpStart.y) > 10) clearTimeout(lpTimer); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => board.addEventListener(ev, () => { clearTimeout(lpTimer); lpStart = null; }));
  board.addEventListener('click', e => {
    const c = e.target.closest('.sweep-cell'); if (!c) return;
    if (lpFired){ lpFired = false; return; }
    tap(+c.dataset.i);
  });
  board.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (lpFired) return;
    const c = e.target.closest('.sweep-cell'); if (c) toggleFlag(+c.dataset.i);
  });
  board.addEventListener('keydown', e => {
    const c = e.target.closest('.sweep-cell'); if (!c) return;
    const i = +c.dataset.i; let j = -1;
    if (e.key === 'f' || e.key === 'F'){ e.preventDefault(); toggleFlag(i); return; }
    if (e.key === 'ArrowRight') j = i % SW_W < SW_W-1 ? i+1 : i; else if (e.key === 'ArrowLeft') j = i % SW_W ? i-1 : i;
    else if (e.key === 'ArrowDown') j = i + SW_W < SW_N ? i+SW_W : i; else if (e.key === 'ArrowUp') j = i >= SW_W ? i-SW_W : i;
    if (j >= 0){ e.preventDefault(); board.children[j].focus(); }
  });
  el.querySelector('#sweep-mode').onclick = () => { st.flagMode = !st.flagMode; api.save(st); render(); };
  render();
  if (fin()) api.show(api.existing());
  return () => clearTimeout(lpTimer);
}

/* =================================================================
   CIRCUIT
   ================================================================= */
const CI_W = 6, CI_N = 36;
const CI_DIRS = [[1,0,-1,4],[2,1,0,8],[4,0,1,1],[8,-1,0,2]]; // bit, dx, dy, opposite bit
const ciRot = (m, t) => { t = ((t % 4) + 4) % 4; for (let k = 0; k < t; k++) m = ((m << 1) | (m >> 3)) & 15; return m; };
const ciDeg = m => (m & 1) + ((m >> 1) & 1) + ((m >> 2) & 1) + ((m >> 3) & 1);
function ciNb(i, d){ const x = i % CI_W + CI_DIRS[d][1], y = Math.floor(i / CI_W) + CI_DIRS[d][2]; return (x >= 0 && x < CI_W && y >= 0 && y < CI_W) ? y*CI_W + x : -1; }
function ciMinTurns(cur, sol){ for (let t = 0; t < 4; t++) if (ciRot(cur, t) === sol) return t; return 0; }
function genCircuit(r){
  let mask = null;
  for (let t = 0; t < 60 && !mask; t++){
    const m = new Array(CI_N).fill(0), inT = new Array(CI_N).fill(false);
    const s = Math.floor(r()*CI_N); inT[s] = true;
    let edges = [], count = 1, ok = true;
    const add = a => { for (let d = 0; d < 4; d++){ const b = ciNb(a, d); if (b >= 0 && !inT[b]) edges.push([a, b, d]); } };
    add(s);
    while (count < CI_N){
      edges = edges.filter(([a,b]) => !inT[b] && ciDeg(m[a]) < 3);
      if (!edges.length){ ok = false; break; }
      const [a, b, d] = edges[Math.floor(r()*edges.length)];
      m[a] |= CI_DIRS[d][0]; m[b] |= CI_DIRS[d][3]; inT[b] = true; count++; add(b);
    }
    if (ok) mask = m;
  }
  if (!mask){ // safe fallback: a snake through every row
    mask = new Array(CI_N).fill(0);
    const order = []; for (let y = 0; y < CI_W; y++) for (let k = 0; k < CI_W; k++) order.push(y*CI_W + (y % 2 ? CI_W-1-k : k));
    for (let k = 0; k < order.length-1; k++){ const a = order[k], b = order[k+1]; const d = CI_DIRS.findIndex((_,dd) => ciNb(a, dd) === b); mask[a] |= CI_DIRS[d][0]; mask[b] |= CI_DIRS[d][3]; }
  }
  const source = Math.floor(r()*CI_N);
  let scr = null, par = 0;
  for (let t = 0; t < 30; t++){
    scr = Array.from({length:CI_N}, () => Math.floor(r()*4));
    par = mask.reduce((a, m, i) => a + ciMinTurns(ciRot(m, scr[i]), m), 0);
    if (par >= 30) break;
  }
  return {mask, source, scr, par};
}
function ciPowered(cur, source){
  const on = new Array(CI_N).fill(false); on[source] = true; const q = [source];
  while (q.length){ const a = q.pop(); for (let d = 0; d < 4; d++){ if (!(cur[a] & CI_DIRS[d][0])) continue; const b = ciNb(a, d); if (b >= 0 && !on[b] && (cur[b] & CI_DIRS[d][3])){ on[b] = true; q.push(b); } } }
  return on;
}
function ciSolved(cur, source){
  const on = ciPowered(cur, source);
  for (let a = 0; a < CI_N; a++){
    if (!on[a]) return false;
    for (let d = 0; d < 4; d++){ if (!(cur[a] & CI_DIRS[d][0])) continue; const b = ciNb(a, d); if (b < 0 || !(cur[b] & CI_DIRS[d][3])) return false; }
  }
  return true;
}
function ciSvg(m, isSource){
  const ends = {1:[50,0], 2:[100,50], 4:[50,100], 8:[0,50]};
  let s = '<svg viewBox="0 0 100 100" aria-hidden="true">';
  [1,2,4,8].forEach(b => { if (m & b) s += `<line x1="50" y1="50" x2="${ends[b][0]}" y2="${ends[b][1]}" stroke="currentColor" stroke-width="18"/>`; });
  s += `<circle cx="50" cy="50" r="9" fill="currentColor"/>`;
  if (isSource) s += `<rect x="25" y="25" width="50" height="50" rx="10" fill="currentColor"/><path d="M54 32 40 53h10l-4 15 14-22H50z" fill="var(--surface)"/>`;
  else if (ciDeg(m) === 1) s += `<circle cx="50" cy="50" r="19" fill="currentColor"/><circle cx="50" cy="50" r="8" fill="var(--surface)"/>`;
  return s + '</svg>';
}
function mountCircuit(el, api){
  const G = genCircuit(api.rng());
  const st = api.load(() => ({turns:new Array(CI_N).fill(0), moves:0, started:false}));
  const fin = () => !!api.existing();
  const cur = () => G.mask.map((m, i) => ciRot(m, G.scr[i] + st.turns[i]));
  el.innerHTML = `
    <div class="circuit-wrap">
      <div class="circuit-top">
        <div class="circuit-stat"><span class="label">Turns</span><br><b id="circuit-moves">0</b><span> / par ${G.par}</span></div>
        <div class="circuit-stat" style="text-align:right"><span class="label">Powered</span><br><b id="circuit-on">0</b><span> / ${CI_N}</span></div>
      </div>
      <div class="circuit-board" id="circuit-board">${G.mask.map((m, i) => `<button class="circuit-cell" data-i="${i}" aria-label="Tile row ${Math.floor(i/CI_W)+1}, column ${i%CI_W+1}${i===G.source?', power source':''}">${ciSvg(m, i === G.source)}</button>`).join('')}</div>
      <p class="msg" id="circuit-msg" aria-live="polite"></p>
      <p class="hint" id="circuit-hint">Tap a tile to turn it a quarter clockwise. Light up every tile with no loose wires.</p>
    </div>`;
  const board = el.querySelector('#circuit-board');
  const btns = [...board.children];
  function update(){
    const c = cur(), on = ciPowered(c, G.source);
    btns.forEach((b, i) => { b.querySelector('svg').style.transform = `rotate(${(G.scr[i] + st.turns[i]) * 90}deg)`; b.classList.toggle('on', on[i]); });
    el.querySelector('#circuit-moves').textContent = st.moves;
    el.querySelector('#circuit-on').textContent = on.filter(Boolean).length;
  }
  function lock(){ board.classList.add('done'); btns.forEach(b => b.disabled = true); el.querySelector('#circuit-hint').hidden = true; }
  board.addEventListener('click', e => {
    const b = e.target.closest('.circuit-cell'); if (!b || fin()) return;
    const i = +b.dataset.i;
    st.turns[i]++; st.moves++; st.started = true; api.save(st); update();
    if (ciSolved(cur(), G.source)){
      const n = st.moves, stars = n <= G.par ? 3 : n <= G.par + 8 ? 2 : 1;
      lock();
      api.finish({score: n, won:true, title: n <= G.par ? 'Perfect wiring' : 'All lit up', detail:`Every tile is powered with no loose ends. ${plural(n,'turn')} against a par of ${G.par}.`,
        summary:'★'.repeat(stars) + '☆'.repeat(3-stars),
        share:`Daybook Circuit No. ${DAY_NO}\n⚡ ${'★'.repeat(stars)}${'☆'.repeat(3-stars)} ${n} turns (par ${G.par})`});
    }
  });
  update();
  if (fin()){ lock(); api.show(api.existing()); }
  return null;
}

/* =================================================================
   SPILL
   ================================================================= */
const SP_N = 12, SP_K = 6, SP_SYM = ['●','▲','■','◆','★','✚'], SP_NAMES = ['red','orange','yellow','green','blue','purple'];
function spRegion(g){
  const own = new Array(g.length).fill(false), c = g[0], q = [0]; own[0] = true;
  while (q.length){ const i = q.pop(), x = i % SP_N, y = Math.floor(i / SP_N);
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const xx = x+dx, yy = y+dy; if (xx < 0 || xx >= SP_N || yy < 0 || yy >= SP_N) continue; const j = yy*SP_N+xx; if (!own[j] && g[j] === c){ own[j] = true; q.push(j); } } }
  return own;
}
function spMove(g, k){ const own = spRegion(g); const out = g.slice(); for (let i = 0; i < out.length; i++) if (own[i]) out[i] = k; return out; }
const spSize = g => spRegion(g).filter(Boolean).length;
const spDone = g => g.every(v => v === g[0]);
function spSolve(g0, look){
  let g = g0.slice(), moves = 0;
  while (!spDone(g) && moves < 80){
    let best = -1, bestK = -1;
    for (let k = 0; k < SP_K; k++){
      if (k === g[0]) continue;
      const g1 = spMove(g, k);
      let score = spSize(g1);
      if (look > 1 && !spDone(g1)){ let b2 = 0; for (let k2 = 0; k2 < SP_K; k2++){ if (k2 === g1[0]) continue; b2 = Math.max(b2, spSize(spMove(g1, k2))); } score = score + b2 * 1.01; }
      else if (spDone(g1)) score = 1e9;
      if (score > best){ best = score; bestK = k; }
    }
    g = spMove(g, bestK); moves++;
  }
  return moves;
}
function genSpill(r){
  const g = Array.from({length:SP_N*SP_N}, () => Math.floor(r()*SP_K));
  const limit = Math.min(spSolve(g, 1), spSolve(g, 2)) + 1;
  return {g, limit};
}
function mountSpill(el, api){
  const G = genSpill(api.rng());
  const st = api.load(() => ({moves:[], started:false}));
  const fin = () => !!api.existing();
  const board = () => st.moves.reduce((g, k) => spMove(g, k), G.g.slice());
  el.innerHTML = `
    <div class="spill-wrap">
      <div class="spill-top">
        <div class="spill-stat"><span class="label">Moves</span><br><b id="spill-moves">0</b><span> / ${G.limit}</span></div>
        <div class="spill-stat" style="text-align:right"><span class="label">Yours</span><br><b id="spill-own">0</b><span> / ${SP_N*SP_N}</span></div>
      </div>
      <div class="spill-board" id="spill-board" role="img" aria-label="12 by 12 board of coloured squares">${G.g.map(() => '<div class="spill-cell"></div>').join('')}</div>
      <div class="spill-pal" id="spill-pal" role="group" aria-label="Choose a colour">${SP_SYM.map((s,k) => `<button class="spill-btn spill-k${k}" data-k="${k}" aria-label="${SP_NAMES[k]} (key ${k+1})">${s}</button>`).join('')}</div>
      <p class="msg" id="spill-msg" aria-live="polite"></p>
      <p class="hint" id="spill-hint">Your patch starts in the top-left corner. Pick a colour to pour it outward. Keys 1–6 work too.</p>
    </div>`;
  const cells = [...el.querySelector('#spill-board').children];
  const pal = el.querySelector('#spill-pal');
  function render(){
    const g = board(), own = spRegion(g), over = fin();
    cells.forEach((c, i) => { c.className = 'spill-cell spill-k' + g[i]; });
    el.querySelector('#spill-moves').textContent = st.moves.length;
    el.querySelector('#spill-own').textContent = own.filter(Boolean).length;
    [...pal.children].forEach((b, k) => { b.classList.toggle('cur', k === g[0]); b.disabled = over || k === g[0]; });
    pal.classList.toggle('done', over);
    el.querySelector('#spill-hint').hidden = over;
  }
  function choose(k){
    if (fin()) return;
    const g = board(); if (k === g[0]) return;
    st.moves.push(k); st.started = true; api.save(st);
    const g2 = board(), n = st.moves.length;
    render();
    if (spDone(g2)){
      api.finish({score: n, won:true, title: n < G.limit ? 'Flooded with moves to spare' : 'Flooded', detail:`The whole board is one colour after ${plural(n,'move')}. The limit was ${G.limit}.`,
        summary:`${n}/${G.limit}`, share:`Daybook Spill No. ${DAY_NO}\n🌊 Flooded in ${n}/${G.limit} moves`});
      render();
    } else if (n >= G.limit){
      const left = SP_N*SP_N - spSize(g2);
      api.finish({won:false, title:'Ran dry', detail:`${plural(left,'square')} still to cover when the ${G.limit} moves ran out.`,
        summary:`X/${G.limit}`, share:`Daybook Spill No. ${DAY_NO}\n🏜️ Ran dry · ${left} squares left`});
      render();
    }
  }
  pal.onclick = e => { const b = e.target.closest('[data-k]'); if (b) choose(+b.dataset.k); };
  const onKey = e => { if (e.metaKey || e.ctrlKey || e.altKey) return; const k = parseInt(e.key, 10); if (k >= 1 && k <= SP_K){ e.preventDefault(); choose(k-1); } };
  document.addEventListener('keydown', onKey);
  render();
  if (fin()) api.show(api.existing());
  return () => document.removeEventListener('keydown', onKey);
}
